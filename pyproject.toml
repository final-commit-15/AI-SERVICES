[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-ai-services"
version = "1.0.0"
description = "Production-grade unified AI Gateway for AgentForge"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AgentForge Team", email = "team@agentforge.ai"}
]
keywords = [
    "ai", "llm", "gateway", "fastapi", "ollama", "openai", "anthropic",
    "gemini", "groq", "together", "openrouter", "rag", "embeddings"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=0.41.2",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "ollama>=0.4.7",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "google-generativeai>=0.8.3",
    "groq>=0.13.0",
    "qdrant-client>=1.11.1",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.32",
    "redis>=5.0.8",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.8",
    "PyYAML>=6.0.1",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.2",
    "faker>=25.2.0",
    "mypy>=1.11.2",
    "types-PyYAML>=6.0.12.12",
    "types-redis>=4.6.0.20241004",
    "ruff>=0.6.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.30",
    "mkdocstrings[python]>=0.26.1",
]

[project.urls]
Homepage = "https://github.com/agentforge/ai-services"
Repository = "https://github.com/agentforge/ai-services"
Issues = "https://github.com/agentforge/ai-services/issues"
Documentation = "https://docs.agentforge.ai/ai-services"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "libs*", "rag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/llm-gateway/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = false

[tool.ruff]
target-version = "py311"
line-length = 120
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "ASYNC", "PTH"]
ignore = ["ANN001", "ANN002", "ANN003", "ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ANN401", "T201", "T203", "PTH123"]
exclude = [".venv", "venv", "__pycache__", ".mypy_cache", ".pytest_cache", ".ruff_cache", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.coverage.run]
source = ["services", "libs", "rag"]
omit = ["*/tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude-lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]